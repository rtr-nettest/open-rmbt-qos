name: Build RMBT QoS Server

on:
  push:
  pull_request:
    branches: [ master, main, dev ]

permissions:
  contents: read

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Shaded JAR (platform-independent), unit tests included.
  # The version is derived from git (`git describe --tags --always`, e.g. "v2.0.0"
  # on a tag, "v2.0.0-4-ged32b3d" after it), so the full history incl. tags is needed.
  # ─────────────────────────────────────────────────────────────────────────────
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test shaded JAR
        run: mvn -B package

      - name: Show version
        run: unzip -p target/RMBTQoSServer.jar version.properties

      - uses: actions/upload-artifact@v4
        with:
          name: qosserver-jar
          path: target/RMBTQoSServer.jar
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # Source archive
  # ─────────────────────────────────────────────────────────────────────────────
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        run: git archive --format=zip --output=rmbt-qos-server-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: rmbt-qos-server-source.zip
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # GitHub Release — only on tag push (e.g. v2.0.0)
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [jar, source-zip]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/qosserver-jar/*.jar
            release-assets/source/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
