##############################
#	SERVER IP SETTINGS
##############################

#the ip all server sockets will be bound to (default: 0.0.0.0 = wildcard = listen on all interfaces)
#simply comment out this setting for a wildcard ip
#to bind the qos service to multiple IP addresses one can provide a comma-separated list of IPs (e.g.: 127.0.0.1,10.0.0.1)
server.ip=127.0.0.1

#check ip of tcp test candidates. if set to true a candidate map will be managed by the server, where only allowed ips (got during the test registration process) will get responses from the qos server
server.ip.check=false


##############################
#	OTHER SERVER SETTINGS
##############################

#use secure connection (TLS) for test requests
server.ssl=true

#TLS certificate chain and unencrypted PKCS#8 private key (PEM), e.g. from Let's Encrypt;
#restart the server after a renewal
server.ssl.certificate=/etc/letsencrypt/live/qos.example.org/fullchain.pem
server.ssl.key=/etc/letsencrypt/live/qos.example.org/privkey.pem
#alternatively a keystore (JKS or PKCS12):
#server.ssl.keystore=qosserver.p12
#server.ssl.keystore.password=

#server port number (listens to incoming test requests, default: 5234)
server.port=5233

#max number of threads (= max concurrent control connections, default: 100);
#newer clients open one connection per test, so use e.g. 200
server.threads=200

#max concurrent control connections per client IP (default: 50)
server.connections.perip=50

##############################
#	CLIENT TOKENS
##############################

#keys the client tokens are signed with: the control server signs a test token with the key of the
#measurement server it assigned, so configure the keys of all measurement servers. A token is valid if
#any key matches. server.secret may hold a comma-separated list; further keys as server.secret.<name>
#(the name is only used in log messages). Keep this file readable for the service user only (chmod 600).
server.secret=
#server.secret.measurement1=
#server.secret.measurement2=

#verify client tokens (default: true); false accepts every client - for testing only
server.token.check=true

#accept only v2 tokens (bound to the client IP), reject legacy v1 tokens (default: false)
server.token.v2only=false

##############################
#	TCP SERVER COMPETENCE SETTINGS
##############################

#all TCP ports that support SIP (test+protocol)
server.tcp.competence.sip=5060

##############################
#	UDP TEST SETTINGS
##############################

#lowest udp port number (default: 10000)
server.udp.minport=10200

#highest udp port number (default: 10050)
server.udp.maxport=10250

#extended udp port list
server.udp.ports=53,123,500,554,4500,5004,5005,7078,7082,27005,27015

#udp port list for nio (non blocking) access
#IMPORTANT: voip tests need non blocking udp sockets because of incoming and outgoing data streams
server.udp.nio.ports=5060

##############################
#	DEBUG SETTINGS
##############################

#verbose level (allowed values: 0,1,2)
#NOTE: largely inert now - it no longer controls general log volume (use logback.xml log levels).
#Still affects the interactive console and a few explicit verbose>=1 code paths.
server.verbose=2

#command console on/off (interactive admin console on stdin; needs a real terminal)
server.console=true

#####################################################################
## LOGGING - OBSOLETE
## Logging was migrated from log4j to SLF4J + Logback. The keys in this
## block are still parsed but have NO EFFECT. Configure logging (console,
## files, levels, Logstash) via src/main/resources/logback.xml
## (or -Dlogback.configurationFile=...). See README.md > Logging.
#####################################################################
#OBSOLETE - log console on/off (now the logback CONSOLE appender)
server.log.console=true

#OBSOLETE - file logging on/off (now a logback file appender)
server.logging=true

#OBSOLETE - log file paths (now logback <file>)
server.log=/var/log/qos/main
server.log.udp=/var/log/qos/udp
server.log.tcp=/var/log/qos/tcp

#OBSOLETE - log4j pattern (now logback <encoder><pattern>)
server.log.pattern=%p %d{ISO8601} - %m%n

#OBSOLETE - syslog appender (configure a syslog appender in logback.xml if needed)
server.syslog=true
server.syslog.host=localhost
server.syslog.pattern=%p %d{ISO8601} %c - %m%n

##############################
#	PLUGINS/SERVICES
##############################

#rest servive on/off
server.service.rest=true
#rest port
server.service.rest.port=10080
#rest ip
server.service.rest.ip=127.0.0.1
#use ssl
server.service.rest.ssl=false